name: Rowster
options:
  bundleIdPrefix: io.github.romainrg
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO

packages:
  RowsterCore:
    path: RowsterCore

targets:
  Rowster:
    type: application
    platform: macOS
    sources:
      - path: Rowster
    dependencies:
      - package: RowsterCore
        product: RowsterCore
    info:
      path: Rowster/Resources/Info.plist
      properties:
        CFBundleDisplayName: Rowster
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Romain Gallien. MIT License."
        NSLocalNetworkUsageDescription: "Rowster connects to the database servers and SSH hosts you configure on your local network."
    settings:
      base:
        PRODUCT_NAME: Rowster
        PRODUCT_BUNDLE_IDENTIFIER: io.github.romainrg.Rowster
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Development tool: renders the app views offscreen to PNG (scripts/screenshots.sh). Never distributed.
  RowsterScreenshots:
    type: application
    platform: macOS
    sources:
      - path: Rowster
        excludes:
          - App/RowsterApp.swift
          - Resources/Info.plist
      - path: Tools/Screenshots
    dependencies:
      - package: RowsterCore
        product: RowsterCore
    settings:
      base:
        PRODUCT_NAME: RowsterScreenshots
        PRODUCT_BUNDLE_IDENTIFIER: io.github.romainrg.Rowster.Screenshots
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Rowster:
    build:
      targets:
        Rowster: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: RowsterCore/RowsterCoreTests
    archive:
      config: Release
  RowsterScreenshots:
    build:
      targets:
        RowsterScreenshots: all
    run:
      config: Debug
