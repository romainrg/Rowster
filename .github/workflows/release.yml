name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the app version
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version in project.yml"
            exit 1
          fi

      - name: Release notes
        run: |
          mkdir -p build/release
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > build/release/notes.md

      - name: Select Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Unit tests
        run: make test

      - name: Universal Release build (DMG and PKG)
        run: scripts/build-release.sh

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/release/Rowster-$version.dmg" \
            "build/release/Rowster-$version.pkg" \
            build/release/SHA256SUMS \
            --title "Rowster $version" \
            --notes-file build/release/notes.md \
            --verify-tag
