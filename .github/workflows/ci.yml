name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Unit tests
        run: make test

      - name: Universal Release build (DMG and PKG)
        run: scripts/build-release.sh

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: Rowster-${{ github.sha }}
          path: |
            build/release/*.dmg
            build/release/*.pkg
            build/release/SHA256SUMS
          retention-days: 7
